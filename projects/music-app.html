<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dong's Soundscape — My Personal Music Vault</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles/music-app.css">
</head>
<body class="music-app-body">

    <div class="app-container">
        <aside class="app-sidebar">
            <div class="sidebar-brand">🎵 Soundscape</div>
            <nav class="sidebar-menu">
                <button class="filter-btn active" data-category="all">🔮 All Tracks</button>
                <button class="filter-btn" data-category="cyberpunk">⚡ Cyberpunk Space</button>
                <button class="filter-btn" data-category="gaming">🎮 Gaming Universe</button>
                <button class="filter-btn" data-category="anime-rock">🎸 Anime & Rock AMV</button>
            </nav>        
        </aside>

        <main class="app-main-content">
            <header class="main-header">
                <h1>Gu Nhạc Đa Vũ Trụ</h1>
                <p>Nơi lưu giữ những giai điệu cứu rỗi linh hồn tôi qua những đêm thức code.</p>
            </header>

            <div id="musicGrid" class="music-grid"></div>
        </main>
    </div>

    <footer class="app-bottom-player">
        <div class="current-track-info">
            <img id="playerCover" src="" alt="Cover">
            <div>
                <h4 id="playerTitle">Chọn một bài hát...</h4>
                <p id="playerArtist">Artist</p>
            </div>
        </div>

        <div class="player-controls-wrapper">
            <div class="control-buttons">
                <button id="prevBtn" class="control-icon-btn">⏮</button>
                <button id="masterPlayBtn" class="control-icon-btn play-main">▶</button>
                <button id="nextBtn" class="control-icon-btn">⏭</button>
                <button class="control-icon-btn story-toggle-btn" title="Xem Góc Trải Lòng">📖</button>
            </div>
            <div class="playback-bar">
                <span id="currentTime">00:00</span>
                <div class="progress-container" id="progressContainer">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <span id="totalDuration">00:00</span>
            </div>
        </div>

        <div class="player-controls">
            <button class="control-icon-btn story-toggle-btn" title="Xem Góc Trải Lòng">📖</button>
            <audio id="mainAudio" src=""></audio>
        </div>
    </footer>    

    <div class="story-slide-panel" id="storyPanel">
        <div class="story-panel-header">
            <span>GÓC TRẢI LÒNG</span>
            <button class="story-close-btn" id="storyCloseBtn">×</button>
        </div>
        <div class="story-slide-panel-body">
            <blockquote id="storyText">Nội dung câu chuyện sẽ hiển thị ở đây...</blockquote>
        </div>
    </div>

    <script src="../script/music-app.js"></script>
</body>
</html>
